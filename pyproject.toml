[project]
name = "veyl"
version = "0.1.0"
description = "A small English PII model with retained training and evaluation records"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
train = ["transformers>=4.50,<5"]
onnx = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2"]
plot = ["matplotlib>=3.11,<4"]

[tool.uv]
package = false
